<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feirinha Pai D'Égua</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/loginartesao.css">
</head>

<body>

    <div class="pagina">

        <!-- LADO ESQUERDO -->
        <div class="esquerda">

            <div class="logo-area">

                <img src="https://6a712e4d693c048900ae34c7.imgix.net/sandbox/1000130618.png" width="600" class="Logo Feirinha Pai D'Égua">

    
            </div>

        </div>


        <!-- LADO DIREITO -->
        <div class="direita">

            <div class="conteudo">

                <span class="pequeno-titulo">
                    FEIRINHA PAI D'ÉGUA
                </span>

                <h1>
                    Cadrastar sua conta
                </h1>

                <p class="descricao">
                    Preencha seus dados para continuar.
                </p>


                <!-- FORMULÁRIO -->

                <form>

                    <div class="campo">

                        <label for="nome">
                            <i class="fa-regular fa-user"></i>
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite seu nome"
                        >

                    </div>


                    <div class="campo">

                        <label for="cpf">
                            <i class="fa-regular fa-id-card"></i>
                            CPF
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            placeholder="Digite seu CPF"
                        >

                    </div>


                    <div class="campo">

                        <label for="nascimento">
                            <i class="fa-regular fa-calendar"></i>
                            Data de nascimento
                        </label>

                        <input
                            type="date"
                            id="nascimento"
                        >

                    </div>


                    <div class="campo">

                        <label for="email">
                            <i class="fa-regular fa-envelope"></i>
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                        >

                    </div>


                    <div class="campo">

                        <label for="telefone">
                            <i class="fa-brands fa-whatsapp"></i>
                            Telefone/WhatsApp
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            placeholder="(91) 99999-9999"
                        >

                    </div>


                    <!-- BOTÕES -->

                    <div class="botoes">

                        <button class="confirmar" type="submit">
                            Confirmar informações
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                         
                        

                        <button class="loja" type="button"  onclick="window.location.href='loginloja.html'">
                            Cadastrar minha loja
                            <i class="fa-solid fa-store"></i>
                        </button>

                    </div>

                </form>

            </div>


            <!-- RODAPÉ -->

            <div class="rodape">


                <div class="redes">

                    <a href="#">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="#">
                        <i class="fa-brands fa-facebook"></i>
                    </a>

                    <a href="#">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>

                </div>

                <p>
                    © 2026 Feirinha Pai D'Égua
                </p>

            </div>

        </div>

    </div>

</body>
</html>
