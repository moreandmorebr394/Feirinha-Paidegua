<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Loja | Feirinha Pai D'Égua</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/cadloja.css">
</head>

<body>

    <div class="card">

        <!-- LADO ESQUERDO -->
        <div class="lado-esquerdo">

            <div class="logo-container">

                <img
                    src="https://6a712e4d693c048900ae34c7.imgix.net/sandbox/1000130618.png"
                    alt="Logo Feirinha Pai D'Égua"
                    class="logo"
                >

            </div>

        </div>


        <!-- LADO DIREITO -->
        <div class="lado-direito">

            <div class="conteudo">

                <!-- CABEÇALHO -->
                <div class="cabecalho">

                    <span>
                        SEJA UM ARTESÃO
                    </span>

                    <h1>
                        Cadastre sua loja
                    </h1>

                    <p>
                        Preencha os dados abaixo para começar.
                    </p>

                </div>


                <!-- FORMULÁRIO -->
                <form id="formLoja">

                    <!-- NOME DA LOJA -->
                    <div class="campo">

                        <label for="nome">
                            Nome da loja
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-store"></i>

                            <input
                                type="text"
                                id="nome"
                                placeholder="Digite o nome da loja"
                            >

                        </div>

                    </div>


                    <!-- CNPJ -->
                    <div class="campo">

                        <label for="cnpj">
                            CNPJ
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-id-card"></i>

                            <input
                                type="text"
                                id="cnpj"
                                placeholder="00.000.000/0000-00"
                                maxlength="18"
                            >

                        </div>

                    </div>


                    <!-- EMAIL DA LOJA -->
                    <div class="campo">

                        <label for="email-loja">
                            E-mail da loja
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="email-loja"
                                placeholder="contato@sualoja.com"
                            >

                        </div>

                    </div>


                    <!-- EMAIL DO RESPONSÁVEL -->
                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="Digite seu e-mail"
                            >

                        </div>

                    </div>


                    <!-- TELEFONE -->
                    <div class="campo">

                        <label for="telefone">
                            Telefone / WhatsApp
                        </label>

                        <div class="input-box">

                            <i class="fa-brands fa-whatsapp"></i>

                            <input
                                type="tel"
                                id="telefone"
                                placeholder="(91) 99999-9999"
                                maxlength="15"
                            >

                        </div>

                    </div>


                    <!-- BOTÃO -->
                    <button
                        class="btn-cadastrar"
                        type="submit"
                    >

                        Cadastrar loja

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>


                    <!-- MENSAGEM DE SUCESSO -->
                    <div
                        id="mensagemSucesso"
                        class="mensagem-sucesso"
                    >

                        <i class="fa-solid fa-circle-check"></i>

                        <span>
                            Loja cadastrada com sucesso!
                        </span>

                    </div>

                </form>

            </div>


            <!-- RODAPÉ -->
            <div class="rodape">

                <div class="linha"></div>

                <div class="redes">

                    <a href="#" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="#" aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="#" aria-label="WhatsApp">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>

                </div>

                <p>
                    © 2026 Feirinha Pai D'Égua
                </p>

            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const formulario = document.getElementById("formLoja");

        const nome = document.getElementById("nome");

        const cnpj = document.getElementById("cnpj");

        const emailLoja =
            document.getElementById("email-loja");

        const email =
            document.getElementById("email");

        const telefone =
            document.getElementById("telefone");

        const mensagemSucesso =
            document.getElementById("mensagemSucesso");


        /* =========================
           ENVIO DO FORMULÁRIO
        ========================= */

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();


            mensagemSucesso.classList.remove("mostrar");


            /* VERIFICA NOME */

            if (nome.value.trim() === "") {

                alert("Digite o nome da loja.");

                nome.focus();

                return;
            }


            /* VERIFICA CNPJ */

            if (cnpj.value.trim() === "") {

                alert("Digite o CNPJ da loja.");

                cnpj.focus();

                return;
            }


            /* VERIFICA EMAIL DA LOJA */

            if (emailLoja.value.trim() === "") {

                alert("Digite o e-mail da loja.");

                emailLoja.focus();

                return;
            }


            if (!emailLoja.value.includes("@")) {

                alert("Digite um e-mail da loja válido.");

                emailLoja.focus();

                return;
            }


            /* VERIFICA EMAIL DO RESPONSÁVEL */

            if (email.value.trim() === "") {

                alert("Digite seu e-mail.");

                email.focus();

                return;
            }


            if (!email.value.includes("@")) {

                alert("Digite um e-mail válido.");

                email.focus();

                return;
            }


            /* VERIFICA TELEFONE */

            if (telefone.value.trim() === "") {

                alert("Digite seu telefone ou WhatsApp.");

                telefone.focus();

                return;
            }


            /* MOSTRA MENSAGEM DE SUCESSO */

            mensagemSucesso.classList.add("mostrar");


            /* LIMPA O FORMULÁRIO */

            formulario.reset();

        });


        /* =========================
           MÁSCARA DO CNPJ
        ========================= */

        cnpj.addEventListener("input", function() {

            let valor = cnpj.value.replace(/\D/g, "");


            valor = valor.replace(
                /^(\d{2})(\d)/,
                "$1.$2"
            );


            valor = valor.replace(
                /^(\d{2})\.(\d{3})(\d)/,
                "$1.$2.$3"
            );


            valor = valor.replace(
                /\.(\d{3})(\d)/,
                ".$1/$2"
            );


            valor = valor.replace(
                /(\d{4})(\d)/,
                "$1-$2"
            );


            cnpj.value = valor;

        });


        /* =========================
           MÁSCARA DO TELEFONE
        ========================= */

        telefone.addEventListener("input", function() {

            let valor =
                telefone.value.replace(/\D/g, "");


            valor = valor.replace(
                /^(\d{2})(\d)/,
                "($1) $2"
            );


            valor = valor.replace(
                /(\d{5})(\d)/,
                "$1-$2"
            );


            telefone.value = valor;

        });

    </script>

</body>

</html>
