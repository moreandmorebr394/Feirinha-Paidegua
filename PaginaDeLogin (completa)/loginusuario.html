<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Feirinha Pai D'Égua</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="css/usuariostyle.css">
    

</head>
<body>

<div class="container">

    <div class="left">

        <img src="https://6a712e4d693c048900ae34c7.imgix.net/sandbox/1000130618.png" width="800" class="Logo Feirinha Pai D'Égua">

        <h2>Bem-vindo novamente!</h2>

        <p>Entre com sua conta para acessar a plataforma.</p>

    </div>


    <div class="right">

        <h1>Login</h1>

        <p>Informe seu e-mail e senha.</p>

        <form>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    placeholder="E-mail"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    placeholder="Senha"
                    required>

            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Lembrar de mim

                </label>

                <a href="#">Esqueci minha senha</a>

            </div>

            <button>

                <i class="fa-solid fa-right-to-bracket"></i>

                Entrar

            </button>

        </form>

        <div class="divider"></div>

        <div class="register">
    Ainda não possui conta?
    <a href="lodinregister.html">Cadastre-se</a>
   </div>

    </div>

</div>

</body>
</html>
