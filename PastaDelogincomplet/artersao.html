<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feirinha Pai D'Égua</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/artesao.css">
</head>

<body>

    <div class="pagina">

        <!-- LADO ESQUERDO -->
        <div class="esquerda">

            <div class="logo-area">

                <img
                    src="https://6a712e4d693c048900ae34c7.imgix.net/sandbox/1000130618.png"
                    alt="Logo Feirinha Pai D'Égua"
                >

            </div>

        </div>


        <!-- LADO DIREITO -->
        <div class="direita">

            <div class="conteudo">

                <span class="pequeno-titulo">
                    FEIRINHA PAI D'ÉGUA
                </span>

                <h1>
                    Cadastrar sua conta
                </h1>

                <p class="descricao">
                    Preencha seus dados para continuar.
                </p>


                <!-- FORMULÁRIO -->
                <form id="formCadastro">

                    <!-- NOME -->
                    <div class="campo">

                        <label for="nome">
                            <i class="fa-regular fa-user"></i>
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite seu nome"
                        >

                    </div>


                    <!-- CPF -->
                    <div class="campo">

                        <label for="cpf">
                            <i class="fa-regular fa-id-card"></i>
                            CPF
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            placeholder="Digite seu CPF"
                            maxlength="14"
                        >

                    </div>


                    <!-- DATA DE NASCIMENTO -->
                    <div class="campo">

                        <label for="nascimento">
                            <i class="fa-regular fa-calendar"></i>
                            Data de nascimento
                        </label>

                        <input
                            type="date"
                            id="nascimento"
                        >

                    </div>


                    <!-- EMAIL -->
                    <div class="campo">

                        <label for="email">
                            <i class="fa-regular fa-envelope"></i>
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                        >

                    </div>


                    <!-- TELEFONE -->
                    <div class="campo">

                        <label for="telefone">
                            <i class="fa-brands fa-whatsapp"></i>
                            Telefone/WhatsApp
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            placeholder="(91) 99999-9999"
                            maxlength="15"
                        >

                    </div>


                    <!-- BOTÕES -->
                    <div class="botoes">

                        <button
                            class="confirmar"
                            type="submit"
                        >

                            Confirmar informações

                            <i class="fa-solid fa-arrow-right"></i>

                        </button>


                        <button
                            class="loja"
                            type="button"
                            onclick="window.location.href='cadloja.html'"
                        >

                            Cadastrar minha loja

                            <i class="fa-solid fa-store"></i>

                        </button>

                    </div>


                    <!-- MENSAGEM DE SUCESSO -->
                    <div
                        id="mensagemSucesso"
                        class="mensagem-sucesso"
                    >

                        <i class="fa-solid fa-circle-check"></i>

                        <span>
                            Cadastro realizado com sucesso!
                        </span>

                    </div>

                </form>

            </div>


            <!-- RODAPÉ -->
            <div class="rodape">

                <div class="redes">

                    <a href="#" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="#" aria-label="Facebook">
                        <i class="fa-brands fa-facebook"></i>
                    </a>

                    <a href="#" aria-label="WhatsApp">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>

                </div>

                <p>
                    © 2026 Feirinha Pai D'Égua
                </p>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        const formulario = document.getElementById("formCadastro");

        const nome = document.getElementById("nome");
        const cpf = document.getElementById("cpf");
        const nascimento = document.getElementById("nascimento");
        const email = document.getElementById("email");
        const telefone = document.getElementById("telefone");

        const mensagemSucesso =
            document.getElementById("mensagemSucesso");


        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            mensagemSucesso.classList.remove("mostrar");


            /* VERIFICA NOME */

            if (nome.value.trim() === "") {

                alert("Digite seu nome completo.");

                nome.focus();

                return;
            }


            /* VERIFICA CPF */

            if (cpf.value.trim() === "") {

                alert("Digite seu CPF.");

                cpf.focus();

                return;
            }


            /* VERIFICA DATA */

            if (nascimento.value === "") {

                alert("Informe sua data de nascimento.");

                nascimento.focus();

                return;
            }


            /* VERIFICA EMAIL */

            if (email.value.trim() === "") {

                alert("Digite seu e-mail.");

                email.focus();

                return;
            }


            if (!email.value.includes("@")) {

                alert("Digite um e-mail válido.");

                email.focus();

                return;
            }


            /* VERIFICA TELEFONE */

            if (telefone.value.trim() === "") {

                alert("Digite seu telefone ou WhatsApp.");

                telefone.focus();

                return;
            }


            /* MOSTRA MENSAGEM NA PÁGINA */

            mensagemSucesso.classList.add("mostrar");


            /* LIMPA OS CAMPOS */

            formulario.reset();

        });


        /* MÁSCARA CPF */

        cpf.addEventListener("input", function() {

            let valor = cpf.value.replace(/\D/g, "");

            valor = valor.replace(
                /(\d{3})(\d)/,
                "$1.$2"
            );

            valor = valor.replace(
                /(\d{3})(\d)/,
                "$1.$2"
            );

            valor = valor.replace(
                /(\d{3})(\d{1,2})$/,
                "$1-$2"
            );

            cpf.value = valor;

        });


        /* MÁSCARA TELEFONE */

        telefone.addEventListener("input", function() {

            let valor = telefone.value.replace(/\D/g, "");

            valor = valor.replace(
                /^(\d{2})(\d)/,
                "($1) $2"
            );

            valor = valor.replace(
                /(\d{5})(\d)/,
                "$1-$2"
            );

            telefone.value = valor;

        });

    </script>

</body>

</html>
