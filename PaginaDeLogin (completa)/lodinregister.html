<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro - Feirinha Pai D'Égua</title>

<link rel="stylesheet" href="css/register.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Lado da Logo -->
    <div class="left-panel">

         <img src="https://6a712e4d693c048900ae34c7.imgix.net/sandbox/1000130618.png" width="800" class="Logo Feirinha Pai D'Égua">

    </div>

    <!-- Lado do Cadastro -->
    <div class="right-panel">

        <h1>Crie sua conta</h1>

        <p>O seu próximo grande passo começa aqui.</p>

        <form>

            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" placeholder="Nome Completo">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" placeholder="Email">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-phone"></i>
                <input type="text" placeholder="Telefone">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Senha">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Confirmar Senha">
            </div>

            <button class="btn-register">
                <i class="fa-solid fa-user-plus"></i>
                Registrar
            </button>

            <button class="btn-login" type="button" onclick="window.location.href='login.html'">
                <i class="fa-solid fa-right-to-bracket"></i>
                Voltar ao Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
