<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Loja | Feirinha Pai D'Égua</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/loginloja.css">
</head>

<body>

    <div class="card">

        <!-- LADO ESQUERDO -->
        <div class="lado-esquerdo">

            <div class="logo-container">

                 <img src="https://6a712e4d693c048900ae34c7.imgix.net/sandbox/1000130618.png" width="600" class="Logo Feirinha Pai D'Égua">

            </div>

        </div>


        <!-- LADO DIREITO -->
        <div class="lado-direito">

            <div class="conteudo">

                <div class="cabecalho">

                    <span>SEJA UM ARTESÃO</span>

                    <h1>
                        Cadastre sua loja
                    </h1>

                    <p>
                        Preencha os dados abaixo para começar.
                    </p>

                </div>


                <form>

                    <!-- NOME -->
                    <div class="campo">

                        <label for="nome">
                            Nome da loja
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-store"></i>

                            <input
                                type="text"
                                id="nome"
                                placeholder="Digite o nome da loja"
                            >

                        </div>

                    </div>


                    <!-- CNPJ -->
                    <div class="campo">

                        <label for="cnpj">
                            CNPJ
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-id-card"></i>

                            <input
                                type="text"
                                id="cnpj"
                                placeholder="00.000.000/0000-00"
                            >

                        </div>

                    </div>


                    <!-- EMAIL DA LOJA -->
                    <div class="campo">

                        <label for="email-loja">
                            E-mail da loja
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="email-loja"
                                placeholder="contato@sualoja.com"
                            >

                        </div>

                    </div>


                    <!-- EMAIL -->
                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="Digite seu e-mail"
                            >

                        </div>

                    </div>


                    <!-- TELEFONE -->
                    <div class="campo">

                        <label for="telefone">
                            Telefone / WhatsApp
                        </label>

                        <div class="input-box">

                            <i class="fa-brands fa-whatsapp"></i>

                            <input
                                type="tel"
                                id="telefone"
                                placeholder="(91) 99999-9999"
                            >

                        </div>

                    </div>


                    <!-- BOTÃO -->
                    <button class="btn-cadastrar" type="submit">

                        Cadastrar loja

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>

            </div>


            <!-- RODAPÉ -->
            <div class="rodape">

                <div class="linha"></div>

                <div class="redes">

                    <a href="#" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="#" aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="#" aria-label="WhatsApp">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>

                </div>

                <p>
                    © 2026 Feirinha Pai D'Égua
                </p>

            </div>

        </div>

    </div>

</body>
</html>
